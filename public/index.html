<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div id="login" class="panel">
      <h1>Basic Chat</h1>
      <input type="text" id="username" placeholder="Your username" autocomplete="off">
      <input type="text" id="room" placeholder="Room (default: general)" autocomplete="off">
      <button onclick="joinChat()">Join Chat</button>
    </div>

    <div id="chat" class="panel hidden">
      <div class="header">
        <h2 id="room-name">general</h2>
        <div id="user-count">0 users online</div>
      </div>
      
      <div id="messages" class="messages"></div>
      
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
